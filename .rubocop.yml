AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"

# This codebase predates RuboCop adoption and consistently uses double-quoted
# strings without frozen_string_literal comments or class doc comments.
# Enforcing these here would mean rewriting hundreds of pre-existing lines
# with no functional benefit, so they're off; new/changed code should still
# follow the remaining (correctness-oriented) cops.
Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

# Pre-existing code shape; not correctness issues.
Style/ClassAndModuleChildren:
  Enabled: false

# `has_image` is a declarative association macro in the style of Rails'
# `has_one_attached`, not a predicate.
Naming/PredicatePrefix:
  AllowedMethods:
    - has_image

# Migrations are linear schema DSL — length/complexity limits don't apply.
Metrics/MethodLength:
  Max: 20
  Exclude:
    - "db/migrate/**/*"

Metrics/AbcSize:
  Max: 25
  Exclude:
    - "db/migrate/**/*"

Metrics/BlockLength:
  Max: 30
  Exclude:
    - "config/routes.rb"
    - "spec/**/*"

Layout/LineLength:
  Max: 130
